[project]
name = "my-mjlab-project-booster-t1"
version = "0.1.0"
description = "Goalkeeper task for Booster T1 with MuJoCo Lab"
authors = [
    { name = "Isaak Bouwmeester", email = "i.p.b.bouwmeester@student.tue.nl" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "mjlab>=1.3.0",
    "torch==2.11.0",
    "warp-lang==1.12.1",
    "numpy",
]

[tool.uv.sources]
torch = { url = "https://download.pytorch.org/whl/cu128/torch-2.11.0%2Bcu128-cp312-cp312-manylinux_2_28_x86_64.whl" }

[project.entry-points."mjlab.tasks"]
goalkeeper_booster_t1 = "my_mjlab_project_booster_t1"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
