[project]
name = "simple_goalkeeper_him"
version = "0.1.0"
description = "HIM-PPO foot-only goalkeeper for Booster T1 with 2-discriminator AMP"
authors = [
    { name = "Isaak Bouwmeester", email = "i.p.b.bouwmeester@student.tue.nl" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "mjlab>=1.3.0",
    "torch==2.11.0",
    "warp-lang==1.12.1",
    "numpy",
    "scipy",
]

[tool.uv.sources]
torch = { url = "https://download.pytorch.org/whl/cu128/torch-2.11.0%2Bcu128-cp312-cp312-manylinux_2_28_x86_64.whl" }

[project.entry-points."mjlab.tasks"]
simple_goalkeeper_him = "simple_goalkeeper_him"

[project.scripts]
sgk_him_train = "simple_goalkeeper_him.scripts.train:main"
sgk_him_play  = "simple_goalkeeper_him.scripts.play:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
